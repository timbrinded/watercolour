schema_version: "1.1"
name: paints-a-waterfall-with-streaks
expected_outcome: |
  A finished 800 by 600 study of water falling over a rock ledge into a pool, with spray where it
  lands and broken light on the pool. The streaks of the fall and the marks on the pool are organic:
  tapered or ragged at their ends, not square-cut bars, and not laid as a regular fringe. The rocks
  read as solid. The whole is made of few strokes.
